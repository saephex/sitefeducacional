<main class="container py-4">

<h1>Contato</h1>
<p>Preencha o formulário para enviar sua dúvida ou mensagem.</p>
<form id="formContato">
    <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" name="nome" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
        <label for="mensagem" class="form-label">Mensagem</label>
        <textarea class="form-control" id="mensagem" name="mensagem" rows="5" required></textarea>
    </div>
    <button type="submit" class="btn btn-outline-secondary">Enviar</button>
</form>
<p id="mensagemContato" class="mt-3" aria-live="polite"></p>
<p class="small">Este formulário é demonstrativo e não envia dados para um servidor.</p>

</main>
<footer class="text-center border-top py-3">
    <p class="mb-0">Projeto Educação Física</p>
</footer>
